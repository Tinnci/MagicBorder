disabled_rules:
  - identifier_name

opt_in_rules:
  - empty_count
  - empty_string
  - force_cast
  - force_unwrapping
  - implicitly_unwrapped_optional
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_imports
  - strict_fileprivate
  - unused_import
  - weak_delegate

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

type_body_length:
  warning: 250
  error: 400

large_tuple:
  warning: 3
  error: 4

included:
  - Sources
  - Tests

excluded:
  - .build
