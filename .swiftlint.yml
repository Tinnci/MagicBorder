disabled_rules:
  - identifier_name

opt_in_rules:
  - empty_count
  - empty_string
  - force_cast
  - force_unwrapping
  - implicitly_unwrapped_optional
  - prefer_self_in_static_references
  - redundant_nil_coalescing
  - sorted_imports
  - strict_fileprivate
  - weak_delegate

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 15
  error: 25

file_length:
  warning: 500
  error: 750
  ignore_comment_only_lines: true

type_body_length:
  warning: 350
  error: 600

large_tuple:
  warning: 3
  error: 4

included:
  - Sources
  - Tests

excluded:
  - .build
