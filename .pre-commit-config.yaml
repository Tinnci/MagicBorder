repos:
  - repo: local
    hooks:
      - id: swift-format
        name: swift format lint
        entry: swift format lint --strict --recursive Sources Tests
        language: system
        pass_filenames: false
        types: [swift]
      - id: swiftlint
        name: SwiftLint
        entry: swiftlint lint --strict
        language: system
        pass_filenames: false
        types: [swift]
