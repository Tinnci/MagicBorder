name: Bug Report
description: Report a crash, connectivity issue, input glitch, or packaging bug in MagicBorder
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please fill out the details below so we can reproduce and fix it quickly.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Protocol Mode
      options:
        - MWB Compatibility (macOS <-> Windows)
        - Modern (macOS <-> macOS)
        - CLI (MagicBorderCLI)
        - App Packaging / UI Only
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS Version & Architecture
      placeholder: "e.g. macOS 15.3 (Apple Silicon arm64)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MagicBorder Version / Commit
      placeholder: "e.g. v0.1.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: peer_version
    attributes:
      label: Remote Peer Version (if applicable)
      placeholder: "e.g. PowerToys Mouse Without Borders 0.89.0 on Windows 11"
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions & Network Checklist
      options:
        - label: Accessibility permission is granted for MagicBorder in System Settings
        - label: Local Network permission is granted and devices are on the same LAN/subnet
        - label: Windows Firewall allows TCP ports 15100 and 15101 (for MWB mode)
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Diagnostics
      description: Paste any console output, connection logs, or crash report snippets (redact security keys!).
      render: text
