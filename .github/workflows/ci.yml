name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: swift --version
      - name: Format Lint
        run: swift format lint --strict --recursive Sources Tests
      - name: Build (debug, warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run Tests (with coverage)
        run: swift test --enable-code-coverage
      - name: Run Tests (Thread Sanitizer)
        run: swift test --sanitize=thread
      - name: Build (release, warnings as errors)
        run: swift build -c release -Xswiftc -warnings-as-errors
