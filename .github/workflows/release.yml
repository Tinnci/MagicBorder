name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify CI Gates
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Publish Release
    needs: verify
    runs-on: macos-26
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package Universal macOS release artifacts
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
          ARCH_MODE: universal
          CREATE_DMG: "1"
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: bash scripts/release_package.sh

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
